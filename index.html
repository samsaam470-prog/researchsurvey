@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap');
:root {
  --bg: #FAF9F6;
  --text: #111111;
  --secondary: #6B6B6B;
  --card: #FFFFFF;
  --border: #E8E5E0;
  --primary: #111111;
  --selected-bg: #F5F3F0;
  --placeholder: #9A9590;
  --radius-card: 16px;
  --radius-input: 12px;
  --radius-btn: 12px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-font-smoothing: antialiased; }
.serif { font-family: 'Instrument Serif', 'Fraunces', Georgia, serif; }
.sans { font-family: 'Inter', sans-serif; }
.input-base {
  width: 100%;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-input);
  padding: 14px 16px;
  font-family: 'Inter', sans-serif;
  font-size: 16px;
  line-height: 1.5;
  color: var(--text);
  outline: none;
  transition: border-color 0.18s ease, box-shadow 0.18s ease;
}
.input-base::placeholder { color: var(--placeholder); }
.input-base:focus { border-color: var(--text); box-shadow: 0 0 0 3px rgba(17,17,17,0.06); }
.textarea-base {
  min-height: 120px;
  resize: vertical;
  line-height: 1.6;
}
.option-card {
  display: flex;
  gap: 14px;
  align-items: flex-start;
  padding: 18px 20px;
  border-radius: var(--radius-card);
  border: 1px solid var(--border);
  background: var(--card);
  cursor: pointer;
  transition: all 0.18s ease;
  user-select: none;
}
.option-card:hover { border-color: #D6D0C8; }
.option-card.selected {
  border: 1.5px solid var(--text);
  background: var(--selected-bg);
}
.radio {
  width: 20px;
  height: 20px;
  border-radius: 999px;
  border: 1.5px solid #C8C3BD;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  margin-top: 1px;
  transition: all 0.18s ease;
  background: white;
}
.option-card.selected .radio {
  border-color: var(--text);
  background: var(--text);
}
.radio-dot {
  width: 8px;
  height: 8px;
  border-radius: 999px;
  background: white;
  opacity: 0;
  transform: scale(0.6);
  transition: all 0.18s ease;
}
.option-card.selected .radio-dot { opacity: 1; transform: scale(1); }
.checkbox {
  width: 20px;
  height: 20px;
  border-radius: 6px;
  border: 1.5px solid #C8C3BD;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  margin-top: 1px;
  background: white;
  transition: all 0.18s ease;
}
.option-card.selected .checkbox {
  border-color: var(--text);
  background: var(--text);
}
.checkmark {
  width: 10px;
  height: 10px;
  opacity: 0;
  transform: scale(0.7);
  transition: all 0.15s ease;
}
.option-card.selected .checkmark { opacity: 1; transform: scale(1); }
.progress-track {
  height: 2px;
  background: var(--border);
  border-radius: 999px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--text);
  transition: width 0.45s cubic-bezier(0.16,1,0.3,1);
}
.btn-primary {
  background: var(--text);
  color: white;
  border: none;
  border-radius: var(--radius-btn);
  padding: 14px 28px;
  font-family: 'Inter', sans-serif;
  font-weight: 500;
  font-size: 15px;
  letter-spacing: -0.01em;
  cursor: pointer;
  transition: all 0.18s ease;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
}
.btn-primary:hover { background: #1E1E1E; transform: translateY(-1px); }
.btn-primary:active { transform: translateY(0); }
.btn-ghost {
  background: transparent;
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius-btn);
  padding: 14px 22px;
  font-family: 'Inter', sans-serif;
  font-weight: 500;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.18s ease;
}
.btn-ghost:hover { border-color: var(--text); background: var(--card); }
.scale-btn {
  flex: 1;
  aspect-ratio: 1 / 1;
  max-width: 64px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: white;
  font-family: 'Inter', sans-serif;
  font-weight: 500;
  font-size: 16px;
  cursor: pointer;
  transition: all 0.18s ease;
  display: grid;
  place-items: center;
}
.scale-btn.selected { border: 1.5px solid var(--text); background: var(--selected-bg); color: var(--text); }
.scale-btn:hover { border-color: #C8C3BD; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
